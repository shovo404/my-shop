<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Add Product</h2>
        <input id="name" placeholder="Product Name" class="w-full mb-2 p-2 border">
        <input id="price" placeholder="Price" class="w-full mb-2 p-2 border">
        <button id="addBtn" class="bg-blue-500 text-white w-full py-2">Add Item</button>
    </div>
    <div id="admin-list" class="max-w-md mx-auto mt-10"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
