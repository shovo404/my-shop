<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | MY SHOP Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { background: #080a11; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
        .sidebar { background: #0f172a; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .input-field { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .action-btn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: 0.3s; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="login-box" class="w-full flex items-center justify-center p-6">
        <div class="glass-panel p-10 w-full max-w-md text-center border-t-4 border-blue-500">
            <div class="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6 text-blue-500 text-2xl">
                <i class="fa fa-shield-halved"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Admin Portal</h2>
            <p class="text-gray-500 text-sm mb-8">Please enter your master credentials</p>
            <input id="adminPass" type="password" placeholder="Master Password" class="input-field text-center mb-4">
            <button id="loginBtn" class="w-full action-btn py-4 rounded-xl font-bold uppercase tracking-widest">Verify & Enter</button>
            <p id="error" class="text-red-500 mt-4 hidden text-xs font-bold italic">Access Denied: Invalid Key</p>
        </div>
    </div>

    <div id="admin-panel" class="hidden flex w-full">
        <aside class="sidebar w-64 p-6 hidden lg:block">
            <div class="mb-10 flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-xs font-black">M</div>
                <span class="font-bold tracking-tighter italic">MY SHOP <span class="text-blue-500">MGR</span></span>
            </div>
            <nav class="space-y-2">
                <a href="#" class="flex items-center gap-3 p-3 bg-blue-600/10 text-blue-400 rounded-xl font-bold text-sm"><i class="fa fa-grid-2"></i> Dashboard</a>
                <a href="#" class="flex items-center gap-3 p-3 text-gray-500 hover:bg-white/5 rounded-xl transition text-sm"><i class="fa fa-list"></i> Service List</a>
                <a href="#" class="flex items-center gap-3 p-3 text-gray-500 hover:bg-white/5 rounded-xl transition text-sm"><i class="fa fa-bullhorn"></i> Announcements</a>
            </nav>
            <button onclick="location.reload()" class="mt-auto flex items-center gap-3 p-3 text-red-500 hover:bg-red-500/5 rounded-xl w-full text-left text-sm font-bold">
                <i class="fa fa-sign-out"></i> Logout
            </button>
        </aside>

        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-3xl font-black">Control Center</h1>
                    <p class="text-gray-500 text-sm">Manage your SMM business operations here.</p>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-xs font-bold text-green-500 bg-green-500/10 px-3 py-1 rounded-full uppercase">System Live</span>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-10">
                <section class="glass-panel p-8">
                    <h3 class="text-lg font-bold mb-6 flex items-center gap-2"><i class="fa fa-plus-circle text-blue-500"></i> New Service</h3>
                    <div class="space-y-4">
                        <input id="pName" placeholder="Service Name (e.g. YouTube Views)" class="input-field">
                        <div class="grid grid-cols-2 gap-4">
                            <input id="pMin" type="number" placeholder="Min Qty" class="input-field">
                            <input id="pMax" type="number" placeholder="Max Qty" class="input-field">
                        </div>
                        <input id="pPrice" type="number" placeholder="Price (৳) Per 1000" class="input-field">
                        <textarea id="pDesc" placeholder="Service Description/Quality info..." class="input-field h-32"></textarea>
                        <button id="addService" class="w-full action-btn py-4 rounded-xl font-bold uppercase">Add to Market</button>
                    </div>
                    
                    <div id="service-list" class="mt-10 space-y-3 max-h-60 overflow-y-auto pr-2">
                        </div>
                </section>

                <section class="space-y-10">
                    <div class="glass-panel p-8 border-l-4 border-yellow-500">
                        <h3 class="text-lg font-bold mb-6 flex items-center gap-2"><i class="fa fa-bolt text-yellow-500"></i> Broadcast Info</h3>
                        <select id="dataType" class="input-field mb-4">
                            <option value="notice">Site Notice (Text)</option>
                            <option value="payment">Payment Gateway (Label)</option>
                        </select>
                        <input id="dataTitle" placeholder="Label or Heading" class="input-field">
                        <textarea id="dataDesc" placeholder="Full text (if notice)" class="input-field h-24"></textarea>
                        <button id="addData" class="w-full bg-yellow-600 hover:bg-yellow-500 text-black py-4 rounded-xl font-bold uppercase transition">Publish Update</button>
                        
                        <div id="data-list" class="mt-8 space-y-2"></div>
                    </div>

                    <div class="glass-panel p-8 text-center border-dashed border-2 border-white/10">
                        <p class="text-gray-500 text-xs">More features coming soon...</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // [Firestore Config remains the same as before]
        const firebaseConfig = {
            apiKey: "AIzaSyBntmghsgXmWa_dCP9-T59Q_6qt8pbxJRI",
            authDomain: "my-premium-shop.firebaseapp.com",
            projectId: "my-premium-shop",
            storageBucket: "my-premium-shop.firebasestorage.app",
            messagingSenderId: "710447563935",
            appId: "1:710447563935:web:cf5cafffa8cc2e211c0eaa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Transition & Logic
        document.getElementById('loginBtn').onclick = async () => {
            const pass = document.getElementById('adminPass').value;
            const snap = await getDoc(doc(db, "settings", "admin_config"));
            if (snap.exists() && pass === snap.data().password) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('error').classList.remove('hidden');
            }
        };

        function loadData() {
            onSnapshot(collection(db, "products"), snap => {
                const list = document.getElementById('service-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    list.innerHTML += `
                        <div class="bg-white/5 p-4 rounded-xl flex justify-between items-center border border-white/5 hover:border-blue-500/30 transition">
                            <div>
                                <p class="font-bold text-sm">${d.data().name}</p>
                                <p class="text-[10px] text-blue-400">৳${d.data().price} per 1000</p>
                            </div>
                            <button onclick="window.del('${d.id}', 'products')" class="text-red-500/50 hover:text-red-500 p-2"><i class="fa fa-trash-can"></i></button>
                        </div>`;
                });
            });

            onSnapshot(collection(db, "offers"), snap => {
                const list = document.getElementById('data-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    list.innerHTML += `
                        <div class="bg-black/20 p-3 rounded-lg flex justify-between items-center text-[10px] uppercase font-bold tracking-widest">
                            <span class="${d.data().type === 'payment' ? 'text-green-500' : 'text-yellow-500'}">${d.data().title}</span>
                            <button onclick="window.del('${d.id}', 'offers')" class="text-gray-600 hover:text-red-500">REMOVE</button>
                        </div>`;
                });
            });
        }

        window.del = async (id, col) => { if(confirm("Confirm removal?")) await deleteDoc(doc(db, col, id)); };

        document.getElementById('addService').onclick = async () => {
            const name = document.getElementById('pName').value;
            if(!name) return alert("Service name required");
            await addDoc(collection(db, "products"), {
                name: name,
                min: document.getElementById('pMin').value,
                max: document.getElementById('pMax').value,
                price: Number(document.getElementById('pPrice').value),
                desc: document.getElementById('pDesc').value
            });
            alert("Service Deployed!");
        };

        document.getElementById('addData').onclick = async () => {
            const title = document.getElementById('dataTitle').value;
            if(!title) return alert("Title required");
            await addDoc(collection(db, "offers"), {
                type: document.getElementById('dataType').value,
                title: title,
                description: document.getElementById('dataDesc').value
            });
            alert("Broadcasted Successfully!");
        };
    </script>
</body>
</html>
