<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-box" class="glass p-8 rounded-2xl shadow-2xl w-96 text-center">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">Admin Login</h2>
        <input id="adminPass" type="password" placeholder="Enter Password" class="w-full bg-gray-800 p-3 rounded mb-4 border border-gray-700 outline-none focus:border-blue-500 text-center">
        <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">Login</button>
        <p id="error" class="text-red-500 mt-4 text-sm hidden">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</p>
    </div>

    <div id="admin-panel" class="hidden w-full max-w-4xl p-8">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-blue-400">Shop Manager</h1>
            <button onclick="location.reload()" class="bg-red-500 text-white px-4 py-1 rounded text-sm hover:bg-red-600 transition">Logout</button>
        </div>

        <div class="glass p-6 rounded-2xl mb-12">
            <h2 class="text-xl mb-4 font-semibold text-gray-200">Add New Item</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="pName" type="text" placeholder="Product Name" class="bg-gray-900 p-2 rounded border border-gray-700 text-white outline-none">
                <input id="pPrice" type="number" placeholder="Price (৳)" class="bg-gray-900 p-2 rounded border border-gray-700 text-white outline-none">
                <input id="pImage" type="text" placeholder="Image URL" class="bg-gray-900 p-2 rounded border border-gray-700 text-white outline-none">
            </div>
            <button id="addItemBtn" class="mt-4 bg-green-600 hover:bg-green-500 px-6 py-2 rounded-lg font-bold transition">Add Product</button>
        </div>

        <h2 class="text-xl mb-4 font-semibold text-gray-400">All Products</h2>
        <div id="admin-product-list" class="grid gap-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- নিচের এই অংশে আপনার নিজের Firebase Config বসান ---
        const firebaseConfig = {
            apiKey: "AIzaSyBntmghsgXmWa_dCP9-T59Q_6qt8pbxJRI",
            authDomain: "my-premium-shop.firebaseapp.com",
            projectId: "my-premium-shop",
            storageBucket: "my-premium-shop.firebasestorage.app",
            messagingSenderId: "710447563935ে",
            appId: "1:710447563935:web:cf5cafffa8cc2e211c0eaa"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // লগইন লজিক
        document.getElementById('loginBtn').onclick = async () => {
            const inputPass = document.getElementById('adminPass').value;
            const passRef = doc(db, "settings", "admin_config");
            
            try {
                const passSnap = await getDoc(passRef);
                if (passSnap.exists() && inputPass === passSnap.data().password) {
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('admin-panel').classList.remove('hidden');
                    document.body.style.alignItems = "start";
                    loadProducts();
                } else {
                    document.getElementById('error').classList.remove('hidden');
                }
            } catch (err) {
                alert("Error connecting to Firebase! Check your Config.");
                console.error(err);
            }
        };

        // প্রোডাক্ট লোড করা
        function loadProducts() {
            onSnapshot(collection(db, "products"), (snapshot) => {
                const list = document.getElementById('admin-product-list');
                list.innerHTML = "";
                snapshot.forEach((snapshotDoc) => {
                    const item = snapshotDoc.data();
                    const id = snapshotDoc.id;
                    list.innerHTML += `
                        <div class="glass p-4 rounded-xl flex items-center justify-between">
                            <div><p class="font-bold text-gray-200">${item.name}</p><p class="text-blue-400 text-sm">৳${item.price}</p></div>
                            <div class="flex gap-2">
                                <input id="price-${id}" type="number" placeholder="New Price" class="bg-gray-900 text-sm p-1 w-24 rounded border border-gray-700 outline-none">
                                <button onclick="window.updatePrice('${id}')" class="bg-blue-600 text-xs px-3 py-1 rounded">Update</button>
                                <button onclick="window.deleteItem('${id}')" class="bg-red-600 text-xs px-3 py-1 rounded">X</button>
                            </div>
                        </div>`;
                });
            });
        }

        // গ্লোবাল ফাংশন
        window.updatePrice = async (id) => {
            const newPrice = document.getElementById(`price-${id}`).value;
            if(newPrice) {
                await updateDoc(doc(db, "products", id), { price: Number(newPrice) });
                alert("Updated!");
            }
        };

        window.deleteItem = async (id) => {
            if(confirm("Delete this product?")) await deleteDoc(doc(db, "products", id));
        };

        document.getElementById('addItemBtn').onclick = async () => {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const image = document.getElementById('pImage').value;
            if(name && price) {
                await addDoc(collection(db, "products"), { name, price: Number(price), image });
                alert("Product Added Successfully!");
            }
        };
    </script>
</body>
</html>
